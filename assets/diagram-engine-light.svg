<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-label="Engine: four config layers merge into the run graph of one pipeline, which the engine walks through a runtime that starts agent terminals with hc; state goes to the run directory, code to a worktree, and GitHub is reached through gh. Runs start from perc run, a router's route step or a fan-out step (as new linked runs, one per slice for a fan-out) or a perc watch trigger, and a run's graph never changes once it starts.">
<style>
.ink{fill:#241914}.mut{fill:#6c5f56}.acc{fill:#c2661a}.wait{fill:#d94a33}.pass{fill:#3f74d8}.surf{fill:#faf7f4}
.s-line{stroke:#d9d0c7}.s-mut{stroke:#6c5f56}.s-acc{stroke:#c2661a}.s-wait{stroke:#d94a33}.s-ink{stroke:#241914}.s-pass{stroke:#3f74d8}
.box{fill:#faf7f4;stroke:#d9d0c7}.box-acc{fill:#f7e3cf;stroke:#c2661a}
.t12{font:600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.t13{font:500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.hd{font:700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.tm{font:11.5px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mut"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acc"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wait"/></marker>
</defs>
<text x="20" y="28" class="hd ink">1 · Layers</text>
<text x="390" y="28" class="hd ink">2 · Run graph of one pipeline</text>
<text x="740" y="28" class="hd ink">3 · Runtime</text>
<rect x="20" y="46" width="300" height="52" rx="8" class="box"/>
<text x="36" y="68" class="t13 ink">core</text>
<text x="36" y="87" class="tm mut">feature stages · approve-groom (locked)</text>
<rect x="20" y="106" width="300" height="52" rx="8" class="box"/>
<text x="36" y="128" class="t13 ink">grounds</text>
<text x="36" y="147" class="tm mut">git repos, pinned in percolator.lock</text>
<rect x="20" y="166" width="300" height="52" rx="8" class="box-acc"/>
<text x="36" y="188" class="t13 ink">profile</text>
<text x="36" y="207" class="tm mut">pipelines in ~/.percolator/config.yaml</text>
<rect x="20" y="226" width="300" height="52" rx="8" class="box" stroke-dasharray="4 3"/>
<text x="36" y="248" class="t13 ink">repo · opt-in</text>
<text x="36" y="267" class="tm mut">.percolator/percolator.yaml</text>
<line x1="332" y1="56" x2="332" y2="268" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="20" y="304" class="tm mut">later layers override earlier ones,</text>
<text x="20" y="321" class="tm mut">unless a target is locked (required: true)</text>
<line x1="342" y1="162" x2="384" y2="162" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="362" y="150" class="tm mut" text-anchor="middle">merge</text>
<rect x="390" y="46" width="290" height="276" rx="10" class="box"/>
<line x1="430" y1="70" x2="430" y2="290" class="s-line" stroke-width="3"/>
<circle cx="430" cy="70" r="6" class="pass"/>
<text x="448" y="75" class="t13 ink">intake</text>
<circle cx="430" cy="102" r="6" class="pass"/>
<text x="448" y="107" class="t13 ink">groom</text>
<rect x="424" y="128" width="12" height="12" rx="2" class="surf s-wait" stroke-width="2"/>
<text x="448" y="139" class="t13 wait">approve-groom</text>
<circle cx="430" cy="166" r="6" class="surf s-mut" stroke-width="2"/>
<text x="448" y="171" class="t13 ink">plan</text>
<circle cx="430" cy="198" r="6" class="surf s-mut" stroke-width="2"/>
<text x="448" y="203" class="t13 ink">implement</text>
<circle cx="430" cy="226" r="3.5" class="surf s-mut" stroke-width="2"/>
<text x="448" y="231" class="t13 mut">after:implement hook</text>
<circle cx="430" cy="258" r="6" class="surf s-mut" stroke-width="2"/>
<text x="448" y="263" class="t13 ink">review</text>
<circle cx="430" cy="290" r="6" class="surf s-mut" stroke-width="2"/>
<text x="448" y="295" class="t13 ink">deliver</text>
<text x="530" y="295" class="tm mut">exit: pr</text>
<path d="M600 258 C650 258 650 198 600 198" fill="none" class="s-acc" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aa)"/>
<text x="648" y="232" class="tm acc">≤3</text>
<line x1="690" y1="162" x2="734" y2="162" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="712" y="150" class="tm mut" text-anchor="middle">walk</text>
<rect x="740" y="46" width="320" height="76" rx="8" class="box"/>
<text x="756" y="70" class="t13 ink">runGraph → Runtime.executeStep</text>
<text x="756" y="90" class="tm mut">HerdrRuntime: renders the task,</text>
<text x="756" y="107" class="tm mut">starts a terminal, waits for done.json</text>
<line x1="900" y1="126" x2="900" y2="166" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="910" y="143" class="tm mut">hc run</text>
<text x="910" y="159" class="tm mut">label percolator.run</text>
<rect x="740" y="172" width="320" height="150" rx="8" class="box"/>
<text x="756" y="196" class="t13 ink">agent terminals, one per step</text>
<rect x="756" y="212" width="80" height="26" rx="13" class="box-acc"/>
<text x="796" y="229" class="tm ink" text-anchor="middle">claude</text>
<rect x="844" y="212" width="74" height="26" rx="13" class="box"/>
<text x="881" y="229" class="tm ink" text-anchor="middle">codex</text>
<rect x="926" y="212" width="90" height="26" rx="13" class="box"/>
<text x="971" y="229" class="tm ink" text-anchor="middle">command</text>
<text x="756" y="266" class="tm mut">skills as plugins · --add-dir run dir</text>
<text x="756" y="284" class="tm mut">names are deterministic, so a resume</text>
<text x="756" y="302" class="tm mut">re-attaches instead of starting over</text>
<rect x="20" y="370" width="320" height="96" rx="8" class="box"/>
<text x="36" y="394" class="t13 ink">~/.percolator/runs/&lt;run-id&gt;</text>
<text x="36" y="414" class="tm mut">state.json · run.json (pipeline, parent)</text>
<text x="36" y="432" class="tm mut">steps/&lt;step&gt;/&lt;attempt&gt;/outputs/</text>
<text x="36" y="450" class="tm mut">route.json · fanout.json, when used</text>
<rect x="390" y="370" width="290" height="96" rx="8" class="box"/>
<text x="406" y="394" class="t13 ink">&lt;repo&gt;/.worktrees/&lt;run-id&gt;</text>
<text x="406" y="414" class="tm mut">branch percolator/&lt;run-id&gt;</text>
<text x="406" y="432" class="tm mut">in .git/info/exclude</text>
<text x="406" y="450" class="tm mut">fan-out slices: &lt;run-id&gt;-s&lt;i&gt;</text>
<rect x="740" y="370" width="320" height="96" rx="8" class="box"/>
<text x="756" y="394" class="t13 ink">GitHub, through gh</text>
<text x="756" y="414" class="tm mut">intake reads the issue · the exit acts:</text>
<text x="756" y="432" class="tm mut">PR, comment, issues, release, review</text>
<text x="756" y="450" class="tm mut">gate posts the ticket for approvers</text>
<line x1="430" y1="326" x2="200" y2="364" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="36" y="346" class="tm mut">saves state after every step</text>
<line x1="840" y1="326" x2="600" y2="364" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="690" y="342" class="tm mut" text-anchor="end">edit code</text>
<line x1="990" y1="326" x2="990" y2="364" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="998" y="350" class="tm mut">builtins</text>
<rect x="20" y="482" width="1040" height="44" rx="8" class="box-acc"/>
<text x="36" y="501" class="t13 ink">Runs start from perc run · a router's route step or a fan-out step (new linked runs) · a perc watch trigger</text>
<text x="36" y="518" class="tm mut">the graph shown is feature's; every pipeline lists its own stages and exit, and a run's graph never changes once it starts</text>
</svg>
