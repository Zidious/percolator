<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" width="1080" height="350" role="img" aria-label="Run status: perc run starts a run; it waits at gates until approved or rejected, pauses at a cap, timeout or escalation until perc resume, or on questions or findings left at a review cap until perc answer, and ends completed when the exit stage passes (a PR, a comment, issues, a release, a review or nothing) or failed when a step fails with no loop.">
<style>
.ink{fill:#efe3cf}.mut{fill:#a8998b}.acc{fill:#f2b25c}.wait{fill:#f07a62}.pass{fill:#6f9cf0}.surf{fill:#1a1512}
.s-line{stroke:#3d332b}.s-mut{stroke:#a8998b}.s-acc{stroke:#f2b25c}.s-wait{stroke:#f07a62}.s-ink{stroke:#efe3cf}.s-pass{stroke:#6f9cf0}
.box{fill:#1a1512;stroke:#3d332b}.box-acc{fill:#3a2919;stroke:#f2b25c}
.t12{font:600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.t13{font:500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.hd{font:700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.tm{font:11.5px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mut"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acc"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wait"/></marker>
</defs>
<circle cx="550" cy="40" r="7" class="ink"/>
<line x1="550" y1="48" x2="550" y2="146" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="538" y="104" class="tm mut" text-anchor="end">perc run</text>
<rect x="440" y="150" width="220" height="56" rx="28" class="box-acc" stroke-width="2"/>
<text x="550" y="183" class="t13 ink" text-anchor="middle">running</text>
<rect x="80" y="40" width="220" height="56" rx="28" class="surf s-wait" stroke-width="2"/>
<text x="190" y="73" class="t13 ink" text-anchor="middle">waiting at a gate</text>
<rect x="80" y="260" width="220" height="56" rx="28" class="surf s-wait" stroke-width="2"/>
<text x="190" y="293" class="t13 ink" text-anchor="middle">paused</text>
<rect x="800" y="40" width="220" height="56" rx="28" class="surf s-pass" stroke-width="2"/>
<text x="910" y="66" class="t13 ink" text-anchor="middle">completed</text>
<text x="910" y="84" class="tm mut" text-anchor="middle">exit: pr, comment, issue, …</text>
<rect x="800" y="260" width="220" height="56" rx="28" class="surf s-wait" stroke-width="2"/>
<text x="910" y="293" class="t13 ink" text-anchor="middle">failed</text>
<line x1="440" y1="160" x2="302" y2="76" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="316" y="62" class="tm mut">reaches a gate</text>
<line x1="302" y1="90" x2="440" y2="174" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="250" y="150" class="tm mut">approve · reject</text>
<line x1="440" y1="196" x2="302" y2="284" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="352" y="268" class="tm mut">cap · timeout · escalation</text>
<text x="352" y="283" class="tm mut">questions · findings at cap</text>
<line x1="302" y1="270" x2="440" y2="184" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="250" y="216" class="tm mut">perc resume</text>
<text x="250" y="231" class="tm mut">perc answer</text>
<line x1="660" y1="164" x2="798" y2="80" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="712" y="104" class="tm mut" text-anchor="end">the exit stage passes</text>
<line x1="660" y1="192" x2="798" y2="276" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="712" y="262" class="tm mut" text-anchor="end">a step fails, no loop</text>
<text x="910" y="118" class="tm mut" text-anchor="middle">perc clean · perc delete</text>
<text x="910" y="338" class="tm mut" text-anchor="middle">perc delete · or start a new run</text>
<text x="550" y="230" class="tm mut" text-anchor="middle">driver stopped: stalled → perc resume</text>
</svg>
