<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Two layers merging: the profile replaces the ground binding for review, but cannot change the audit node the ground locked with required: true; rules from both layers apply.">
<style>
.ink{fill:#efe3cf}.mut{fill:#a8998b}.acc{fill:#f2b25c}.wait{fill:#f07a62}.pass{fill:#6f9cf0}.surf{fill:#1a1512}
.s-line{stroke:#3d332b}.s-mut{stroke:#a8998b}.s-acc{stroke:#f2b25c}.s-wait{stroke:#f07a62}.s-ink{stroke:#efe3cf}.s-pass{stroke:#6f9cf0}
.box{fill:#1a1512;stroke:#3d332b}.box-acc{fill:#3a2919;stroke:#f2b25c}
.t12{font:600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.t13{font:500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.hd{font:700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.tm{font:11.5px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mut"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acc"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wait"/></marker>
</defs>
<text x="300" y="28" class="tm ink">bindings.review</text>
<text x="570" y="28" class="tm ink">nodes.audit</text>
<text x="840" y="28" class="tm ink">rules</text>
<text x="20" y="74" class="t13 ink">ground team</text>
<text x="20" y="92" class="tm mut">graph.yaml</text>
<rect x="300" y="50" width="250" height="40" rx="8" class="box"/>
<text x="312" y="75" class="tm ink">claude · sonnet</text>
<rect x="570" y="50" width="250" height="40" rx="8" class="box-acc"/>
<text x="582" y="75" class="tm ink">command: [pnpm, audit]</text>
<text x="582" y="108" class="tm acc">required: true · locked</text>
<rect x="840" y="50" width="250" height="40" rx="8" class="box"/>
<text x="852" y="75" class="tm ink">allowed_models: [opus, sonnet]</text>
<text x="20" y="154" class="t13 ink">profile default</text>
<text x="20" y="172" class="tm mut">~/.percolator/config.yaml</text>
<rect x="300" y="130" width="250" height="40" rx="8" class="box"/>
<text x="312" y="155" class="tm ink">claude · opus</text>
<text x="312" y="188" class="tm mut">replaces the ground’s binding</text>
<rect x="570" y="130" width="250" height="40" rx="8" class="surf s-wait" stroke-width="2"/>
<text x="582" y="155" class="tm ink">command: [npm, audit]</text>
<text x="582" y="188" class="tm wait">LockViolation: fails validate</text>
<rect x="840" y="130" width="250" height="40" rx="8" class="box"/>
<text x="852" y="155" class="tm ink">max_rounds_ceiling: 3</text>
<text x="20" y="254" class="t13 ink">merged graph</text>
<rect x="300" y="230" width="250" height="40" rx="8" class="box"/>
<text x="312" y="255" class="tm ink">claude · opus</text>
<rect x="570" y="230" width="250" height="40" rx="8" class="box"/>
<text x="582" y="255" class="tm ink">command: [pnpm, audit]</text>
<text x="582" y="288" class="tm mut">the profile may restate it unchanged</text>
<rect x="840" y="230" width="250" height="40" rx="8" class="box"/>
<text x="852" y="255" class="tm ink">both rules apply</text>
<line x1="20" y1="208" x2="1090" y2="208" class="s-line" stroke-dasharray="3 5"/>
<line x1="282" y1="60" x2="282" y2="160" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<text x="274" y="116" class="tm mut" text-anchor="end">later</text>
</svg>
