<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="1080" height="380" role="img" aria-label="Two setups side by side. On its own you drive perc from a terminal. With Herdr, the panel and cup read perc status --json and run perc approve, reject and resume for you; perc, hc and the agents are the same in both.">
<style>
.ink{fill:#efe3cf}.mut{fill:#a8998b}.acc{fill:#f2b25c}.wait{fill:#f07a62}.pass{fill:#6f9cf0}.surf{fill:#1a1512}
.s-line{stroke:#3d332b}.s-mut{stroke:#a8998b}.s-acc{stroke:#f2b25c}.s-wait{stroke:#f07a62}.s-ink{stroke:#efe3cf}.s-pass{stroke:#6f9cf0}
.box{fill:#1a1512;stroke:#3d332b}.box-acc{fill:#3a2919;stroke:#f2b25c}
.t12{font:600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.t13{font:500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.hd{font:700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.tm{font:11.5px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mut"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acc"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wait"/></marker>
</defs>
<text x="20" y="28" class="hd ink">perc on its own</text>
<text x="570" y="28" class="hd ink">perc with Herdr on top</text>
<line x1="540" y1="10" x2="540" y2="370" class="s-line" stroke-dasharray="3 5"/>
<rect x="20" y="50" width="490" height="76" rx="8" class="box"/>
<text x="36" y="76" class="t13 ink">you, in any terminal</text>
<text x="36" y="98" class="tm mut">perc run · perc status · perc approve / reject</text>
<text x="36" y="114" class="tm mut">perc resume · perc clean · perc delete</text>
<line x1="265" y1="130" x2="265" y2="170" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="570" y="50" width="490" height="76" rx="8" class="box-acc" stroke-width="1.5"/>
<text x="586" y="76" class="t13 ink">Herdr app · Percolator panel + status-bar cup</text>
<text x="586" y="98" class="tm mut">board of runs · stage pipeline · Approve / Reject /</text>
<text x="586" y="114" class="tm mut">Resume buttons · “#n needs you” notices</text>
<line x1="740" y1="130" x2="740" y2="170" class="s-acc" stroke-width="1.5" marker-end="url(#aa)"/>
<text x="732" y="155" class="tm acc" text-anchor="end">perc approve | reject | resume</text>
<line x1="900" y1="170" x2="900" y2="130" class="s-acc" stroke-width="1.5" marker-end="url(#aa)"/>
<text x="908" y="155" class="tm acc">perc status --json</text>
<rect x="20" y="176" width="490" height="52" rx="8" class="box"/>
<text x="36" y="207" class="t13 ink">perc · engine, run state, gate</text>
<line x1="265" y1="232" x2="265" y2="262" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="20" y="268" width="490" height="40" rx="8" class="box"/>
<text x="36" y="293" class="t13 ink">hc · starts and watches terminals</text>
<line x1="265" y1="312" x2="265" y2="330" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="20" y="334" width="490" height="36" rx="8" class="box"/>
<text x="36" y="357" class="t13 ink">agents: claude · codex · command</text>
<rect x="570" y="176" width="490" height="52" rx="8" class="box"/>
<text x="586" y="207" class="t13 ink">perc · engine, run state, gate</text>
<line x1="815" y1="232" x2="815" y2="262" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="570" y="268" width="490" height="40" rx="8" class="box"/>
<text x="586" y="293" class="t13 ink">hc · starts and watches terminals</text>
<line x1="815" y1="312" x2="815" y2="330" class="s-mut" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="570" y="334" width="490" height="36" rx="8" class="box"/>
<text x="586" y="357" class="t13 ink">agents: claude · codex · command</text>
<text x="494" y="293" class="tm mut" text-anchor="end">runtime.space: false</text>
<text x="1044" y="293" class="tm acc" text-anchor="end">one Herdr space per run</text>
</svg>
