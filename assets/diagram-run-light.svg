<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 300" width="1150" height="300" role="img" aria-label="The feature pipeline's run train (other pipelines run their own stages, from intake to an exit): intake, groom, the approve-groom gate, plan, implement, an optional hook, review looping back to implement up to three times, the pr-description hook, then deliver opens a pull request.">
<style>
.ink{fill:#241914}.mut{fill:#6c5f56}.acc{fill:#c2661a}.wait{fill:#d94a33}.pass{fill:#3f74d8}.surf{fill:#faf7f4}
.s-line{stroke:#d9d0c7}.s-mut{stroke:#6c5f56}.s-acc{stroke:#c2661a}.s-wait{stroke:#d94a33}.s-ink{stroke:#241914}.s-pass{stroke:#3f74d8}
.box{fill:#faf7f4;stroke:#d9d0c7}.box-acc{fill:#f7e3cf;stroke:#c2661a}
.t12{font:600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.06em}.t13{font:500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.hd{font:700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.tm{font:11.5px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mut"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="acc"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wait"/></marker>
</defs>
<text x="40" y="30" class="hd ink">feature pipeline</text>
<text x="1110" y="30" class="t13 mut" text-anchor="end">other pipelines: your stages, intake first, an exit last</text>
<line x1="70" y1="160" x2="1070" y2="160" class="s-line" stroke-width="6" stroke-linecap="round"/>
<line x1="70" y1="160" x2="333" y2="160" stroke-width="6" stroke-linecap="round" class="s-pass"/>
<path d="M840 144 C840 62 620 62 620 144" fill="none" class="s-acc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
<text x="730" y="66" class="t13 acc" text-anchor="middle">↺ findings go back to implement · 3 rounds</text>
<path d="M345 146 C345 92 220 92 220 144" fill="none" class="s-wait" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aw)"/>
<text x="282" y="94" class="t13 wait" text-anchor="middle">reject → re-groom</text>
<circle cx="70" cy="160" r="15" class="pass"/>
<text x="70" y="122" class="tm mut" text-anchor="middle">done</text>
<text x="70" y="205" class="t12 ink" text-anchor="middle">INTAKE</text>
<text x="70" y="226" class="tm mut" text-anchor="middle">github.intake</text>
<text x="70" y="280" class="t13 ink" text-anchor="middle">reads the issue</text>
<circle cx="220" cy="160" r="15" class="pass"/>
<text x="220" y="122" class="tm mut" text-anchor="middle">done</text>
<text x="220" y="205" class="t12 ink" text-anchor="middle">GROOM</text>
<text x="220" y="226" class="tm mut" text-anchor="middle">claude · opus</text>
<text x="220" y="243" class="tm mut" text-anchor="middle">brainstorming</text>
<text x="220" y="280" class="t13 ink" text-anchor="middle">groomed ticket</text>
<rect x="333" y="148" width="24" height="24" rx="4" class="surf s-wait" stroke-width="3"/>
<text x="345" y="205" class="t12 wait" text-anchor="middle">GATE</text>
<text x="345" y="226" class="tm mut" text-anchor="middle">approve-groom</text>
<text x="345" y="280" class="t13 wait" text-anchor="middle">you decide</text>
<circle cx="470" cy="160" r="15" class="surf s-mut" stroke-width="3"/>
<text x="470" y="205" class="t12 ink" text-anchor="middle">PLAN</text>
<text x="470" y="226" class="tm mut" text-anchor="middle">claude · opus</text>
<text x="470" y="243" class="tm mut" text-anchor="middle">writing-plans</text>
<text x="470" y="280" class="t13 ink" text-anchor="middle">plan</text>
<circle cx="620" cy="160" r="15" class="surf s-mut" stroke-width="3"/>
<text x="620" y="205" class="t12 ink" text-anchor="middle">IMPLEMENT</text>
<text x="620" y="226" class="tm mut" text-anchor="middle">claude · opus</text>
<text x="620" y="243" class="tm mut" text-anchor="middle">plans + TDD</text>
<text x="620" y="280" class="t13 ink" text-anchor="middle">commits</text>
<circle cx="730" cy="160" r="7" class="surf s-mut" stroke-width="2.5"/>
<text x="730" y="205" class="t12 mut" text-anchor="middle">HOOK</text>
<text x="730" y="226" class="tm mut" text-anchor="middle">yours</text>
<circle cx="840" cy="160" r="15" class="surf s-mut" stroke-width="3"/>
<text x="840" y="205" class="t12 ink" text-anchor="middle">REVIEW</text>
<text x="840" y="226" class="tm mut" text-anchor="middle">claude · medium</text>
<text x="840" y="243" class="tm mut" text-anchor="middle">deep-dive-review</text>
<text x="840" y="280" class="t13 ink" text-anchor="middle">findings</text>
<circle cx="955" cy="160" r="7" class="surf s-mut" stroke-width="2.5"/>
<text x="955" y="205" class="t12 mut" text-anchor="middle">PR TEXT</text>
<text x="955" y="226" class="tm mut" text-anchor="middle">pr-description</text>
<circle cx="1070" cy="160" r="15" class="surf s-mut" stroke-width="3"/>
<text x="1070" y="205" class="t12 ink" text-anchor="middle">DELIVER</text>
<text x="1070" y="226" class="tm mut" text-anchor="middle">github.open_pr</text>
<text x="1070" y="280" class="t13 ink" text-anchor="middle">pull request</text>
</svg>
